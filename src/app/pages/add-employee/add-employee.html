<div class="add-employee-container">
  <div class="form-header">
    <h1>Add New Employee</h1>
    <p class="form-subtitle">Fill in the details below to add a new employee to the system</p>
  </div>

  <form class="employee-form">
    <div class="form-grid">
    
      <!-- Employee Name -->
      <div class="form-group">
        <label for="employeeName">Employee Name</label>
        <input type="text" id="employeeName" name="employeeName" placeholder="Enter full name" [(ngModel)]="employeeObj.employeeName"/>
      </div>

      <!-- Contact Number -->
      <div class="form-group">
        <label for="contactNo">Contact Number</label>
        <input type="tel" id="contactNo" name="contactNo" placeholder="Enter contact number" [(ngModel)]="employeeObj.contactNo" />
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="emailId">Email Address</label>
        <input type="email" id="emailId" name="emailId" placeholder="Enter email address" [(ngModel)]="employeeObj.emailId" />
      </div>

      <!-- Department Dropdown -->
      <div class="form-group">
        <label for="deptId">Department</label>
        <select id="deptId" name="deptId" (change)="onChangeParent($event)" [(ngModel)]="employeeObj.deptId">
            @for ( dept of deparmentList(); track dept.departmentId) {
          <option [value]="dept.departmentId">{{ dept.departmentName }}</option>
            }
        </select>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" [(ngModel)]="employeeObj.password" />
      </div>

      <!-- Gender Dropdown -->
      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" [(ngModel)]="employeeObj.gender">
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      
      <div class="form-group">
        <label for="childDeptId">Child Department</label>
        <select id="childDeptId" name="childDeptId" [(ngModel)]="employeeObj.deptId">
          @for ( childDep of childDepartmentList(); track $index){
            <option [value]="childDep.childDeptId">{{ childDep.departmentName }}</option>
          }
        </select>
      </div>

       <div class="form-group">
        <label for="role">Role</label>
        <input type="text" id="role" name="role" placeholder="Enter role" [(ngModel)]="employeeObj.role" />
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary">Cancel</button>
      <button type="submit" class="btn btn-primary" (click)="onCreateEmployee()">Add Employee</button>
    </div>
  </form>
</div>
